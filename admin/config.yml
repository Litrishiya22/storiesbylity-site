backend:
  name: git-gateway
  branch: main

media_folder: "content/images"
public_folder: "/content/images"

collections:
  - name: "stories"
    label: "Stories"
    files:
      - file: "content/stories.json"
        label: "Story shelf"
        name: "shelf"
        fields:
          - label: "Stories"
            name: "stories"
            widget: "list"
            summary: "{{title}} — {{age}}"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Author", name: "author", widget: "string", default: "Storiesbylity"}
              - {label: "Age range", name: "age", widget: "string", default: "3–6 yrs", hint: "e.g. 3–6 yrs"}
              - {label: "Blurb", name: "blurb", widget: "text"}
              - {label: "Cover image", name: "cover", widget: "image", required: false, hint: "Optional — shows on the story card instead of a plain color."}
              - label: "Spine colors"
                name: "color"
                widget: "list"
                default: ["#F4A259", "#B9722C", "#3B2410"]
                hint: "Three hex colors: light, mid, dark. Leave as default if unsure."
              - label: "Pages"
                name: "pages"
                widget: "list"
                hint: "Each item is one page shown in the reader. Click 'Add' to add another page."

  - name: "site"
    label: "Site content"
    files:
      - file: "content/site.json"
        label: "About & contact"
        name: "site"
        fields:
          - {label: "About heading", name: "aboutTitle", widget: "string"}
          - {label: "About paragraph 1", name: "aboutP1", widget: "text"}
          - {label: "About paragraph 2", name: "aboutP2", widget: "text"}
          - {label: "Contact email", name: "contactEmail", widget: "string"}
              
